# Źródło projektu Xcode. Plik .xcodeproj jest z tego generowany i też leży
# w repozytorium — żeby otwarcie projektu wymagało samego Xcode, a nie
# jeszcze XcodeGena. Kto zmienia strukturę celów, zmienia ten plik
# i przepuszcza `xcodegen generate`; kto tylko czyta kod, nie musi wiedzieć,
# że XcodeGen istnieje.
#
# Powód, dla którego projekt Xcode w ogóle tu jest: pakietu SwiftPM nie da
# się zbudować do pakietu .app z Info.plist. Aplikacja w pasku menu bez
# Info.plist z LSUIElement pokazuje ikonę w Docku i zabiera pasek menu
# u góry ekranu, czyli robi dokładnie to, czego to narzędzie ma nie robić.

name: LlamaScope
options:
  bundleIdPrefix: com.qshmobile
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  LlamaScopeCore:
    path: Core

targets:
  LlamaScope:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: LlamaScopeCore
        product: LlamaScopeCore
      # Wybór języka i odmiana liczb. Wymienione wprost, mimo że wchodzą
      # i tak razem z rdzeniem — inaczej `import LlamaScopeText` w widoku
      # zależałby od tego, czy Xcode akurat udostępni moduł przechodni.
      - package: LlamaScopeCore
        product: LlamaScopeText
      # `link: false` nie jest ostrożnością — jest treścią obietnicy z §9.
      # Pośrednik ma **jechać w pakiecie** jako osobny plik wykonywalny
      # i **nie wejść do binarki aplikacji**. Sprawdzalne z zewnątrz:
      #   nm LlamaScope.app/Contents/MacOS/LlamaScope | grep ProxyCore
      # ma nie zwrócić nic.
      - target: LlamaScopeProxy
        link: false
        embed: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        # Bez tego aplikacja ma ikonę w Docku i własny pasek menu u góry.
        # Narzędzie, które mieszka w pasku stanu, ma być w pasku stanu.
        LSUIElement: true
        CFBundleName: LlamaScope
        CFBundleShortVersionString: "0.9"
        CFBundleVersion: "2"
        NSHumanReadableCopyright: "LlamaScope — MIT"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qshmobile.LlamaScope
        MARKETING_VERSION: "0.9"
        SWIFT_VERSION: "5.0"
        # Szczebel 0.9 z §14: podpis Developer ID i notaryzacja. Tożsamość
        # wpisana wprost, a nie zostawiona automatowi — automat wybiera to,
        # co akurat jest w pęku kluczy, a w tym pęku leży też „Apple
        # Distribution”, którym nie wolno podpisać czegoś rozdawanego poza
        # App Store. Zły podpis przechodzi budowę i przewraca się dopiero
        # u kogoś obcego, czyli najpóźniej jak się da.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 83L8M7P67X
        CODE_SIGN_IDENTITY: "Developer ID Application"
        # Notaryzacja odrzuca pakiet bez hardened runtime, bez znacznika
        # czasu i bez podpisu na **każdym** pliku wykonywalnym w środku.
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_CODE_SIGN_FLAGS: "--timestamp"

  # Pośrednik z §12 jako osobny program w pakiecie. Źródła te same, co
  # bierze SwiftPM — jeden kod, dwa sposoby zbudowania: `swift run` dla
  # sprawdzania i pakiet .app dla wydania.
  LlamaScopeProxy:
    type: tool
    platform: macOS
    sources:
      - path: Core/Sources/LlamaScopeProxy
    dependencies:
      - package: LlamaScopeCore
        product: LlamaScopeProxyCore
      - package: LlamaScopeCore
        product: LlamaScopeCore
    settings:
      base:
        PRODUCT_NAME: LlamaScopeProxy
        SWIFT_VERSION: "5.0"
        # Pośrednik podpisany tak samo jak aplikacja i z tego samego powodu:
        # to osobny plik wykonywalny w pakiecie, a notaryzacja patrzy na
        # każdy z osobna. Podpisuje się jako pierwszy — aplikacja liczy swój
        # podpis z tego, co już w niej leży.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 83L8M7P67X
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_CODE_SIGN_FLAGS: "--timestamp"

# Schemat wpisany wprost, a nie zostawiony Xcode do dorobienia u siebie.
# Bez tego `xcodebuild -scheme LlamaScope` działa na tej maszynie i nie
# działa na czyjejś, dopóki ktoś nie otworzy projektu ręcznie.
schemes:
  LlamaScope:
    build:
      targets:
        LlamaScope: all
    run:
      config: Debug
    archive:
      config: Release
